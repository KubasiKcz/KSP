<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ADZIP">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./graphics/icons/icon_32.png" type="image/x-icon">
    <script>
    (() => {
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
            window.__darkModeImage = "./graphics/icons/darkmode-switch.png";
        } else {
            window.__darkModeImage = "./graphics/icons/lightmode-switch.png";
        }
    })();
    </script>
    <link rel="stylesheet" href="./stylsheet.css">
    <script src="./scripts/mode.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/index.js"></script>
    <title>vočko</title>
</head>
<body>
    <header>
        <a onclick="wtf()" id="vocko">
            <h1 id="logo">vočko<span id="blinking">_</span></h1>
        </a>
        <div id="header-buttons">
            <div id="search" style="display: none;">
                <img src="./graphics/icons/search.png" alt="search icon">
                <form action=search.php method="post">
                    <input id="bar" type="text" placeholder="NEFACHA, NEPOUŽÍVAT">
                </form>
            </div>
            <div id="mode">
                <img alt="dark mode" id="dark_mode" onclick="mode()">
            </div>

        </div>
    </header>
    <main>
        <section class="boxes">
            <div id="dynamic-content"></div>
        </section>
        <div id="help">
            <h1>Nápověda</h1>
            <button onclick="closeHelp()">✖</button>
            <div id="help-content">
                <p>Vítejte na vočku!</p>
                <p>Pro upload/edit poznámek vytvořtě <a href="https://github.com/KubasiKcz/KSP/issues" id="issues">issue na githubu</a></p>
                <p>Všichni budou rádi když přídáte ruku k dílu</p>
            </div>
        </div>
        <div id="version" style="display: none;"> <h1>CHANGELOG</h1>
            <button onclick="document.getElementById('version').classList.remove('version-modal')">X</button>
            <table></table>
        </div>
    </main>
    <footer>
        <div id="footer_txt">
            <p>vočko - Veškeré položky na webu nejsou prací vočka, ale komunity</p>
            <p id="ver_nmr" onclick=changelog()>Načítám verzi...</p>
            <p>Bylo použito Generativní AI (bohužel).</p>
        </div>
        <div id="footer_btns">
            <button id="help" onclick=help()><img src="./graphics/icons/help.png" alt="Help"></button>
            <button id="github" onclick="github_redirect()"><img src="./graphics/icons/github.png" alt="Github"></button>
        </div>
    </footer>
</body>
</html>
